<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleprompter & Cronómetro de Ensayo - Seminario XAI</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 26, 44, 0.65);
      --card-border: rgba(56, 189, 248, 0.2);
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --timer-color: var(--primary);
      --script-font-size: 2.05rem; /* Tamaño de fuente grande y legible */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .btn {
      background: #1e293b;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
    }

    .btn:hover {
      background: #334155;
      border-color: var(--primary);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.82rem;
    }

    .btn-primary {
      background: var(--primary);
      color: #0b0f19;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .btn-active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Barra superior compacta sticky */
    .timer-strip {
      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      gap: 16px;
      width: 100%;
    }

    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.2s linear, background-color 0.3s ease;
    }

    .timer-display {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-shrink: 0;
    }

    .countdown-number {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--timer-color);
      line-height: 1;
      letter-spacing: -1px;
      transition: color 0.3s;
    }

    .timer-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .timer-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .total-time-badge {
      font-size: 0.82rem;
      font-family: monospace;
      color: #cbd5e1;
    }

    .slide-pills-wrapper {
      display: flex;
      align-items: center;
      overflow-x: auto;
      flex: 1;
      margin: 0 16px;
      padding-bottom: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(56, 189, 248, 0.4) transparent;
    }

    .slide-pills {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .slide-pill {
      padding: 6px 13px;
      border-radius: 20px;
      background: #1e293b;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .slide-pill:hover {
      background: #334155;
      color: #fff;
    }

    .slide-pill.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
    }

    .timer-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Contenedor principal a pantalla completa sin márgenes desperdiciados */
    main {
      flex: 1;
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 16px 28px 24px 28px;
      display: flex;
      flex-direction: column;
    }

    .script-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px 34px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      backdrop-filter: blur(14px);
    }

    .slide-header-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      gap: 16px;
    }

    .diapo-badge-container {
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
    }

    .diapo-badge {
      font-size: 0.95rem;
      font-weight: 800;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.45);
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .diapo-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.25;
    }

    .diapo-subtitle {
      font-size: 0.98rem;
      color: var(--text-muted);
      font-weight: 450;
    }

    .meta-badges-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .reading-speed-badge {
      font-size: 0.82rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 12px;
      color: #cbd5e1;
      white-space: nowrap;
      font-weight: 500;
    }

    .stats-badge {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Tipografía fluida y continua: Sin cajas divididas por párrafo */
    .teleprompter-content {
      font-size: var(--script-font-size, 2.05rem);
      line-height: 1.75;
      color: #f8fafc;
      font-weight: 400;
      letter-spacing: 0.01em;
      text-align: left;
    }

    .teleprompter-content p {
      margin-bottom: 16px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .teleprompter-content p:last-child {
      margin-bottom: 0;
    }

    .teleprompter-content strong {
      color: #38bdf8;
      font-weight: 700;
    }

    /* Apoyo Visual discreto al pie */
    .visual-cue-box {
      margin-top: 14px;
      background: rgba(129, 140, 248, 0.1);
      border-left: 4px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 12px 18px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .visual-cue-title {
      font-size: 0.88rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--accent);
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .visual-cue-text {
      font-size: 1.05rem;
      color: #cbd5e1;
      line-height: 1.45;
    }

    /* Barra inferior */
    footer {
      background: rgba(11, 15, 25, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      bottom: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .playback-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-large {
      padding: 9px 22px;
      font-size: 0.98rem;
      border-radius: 8px;
    }

    .hotkey-hints {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }

    kbd {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 2px 7px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #fff;
    }

    @keyframes pulse-warning {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }

    .time-warning {
      animation: pulse-warning 1s infinite;
      color: var(--yellow) !important;
    }

    .time-critical {
      animation: pulse-warning 0.6s infinite;
      color: var(--red) !important;
    }
  </style>
</head>
<body>

  <!-- Timer & Progress Strip -->
  <div class="timer-strip">
    <div class="timer-display">
      <div class="countdown-number" id="timerDisplay">01:15</div>
      <div class="timer-meta">
        <div class="timer-label" id="timerStatusLabel">TIEMPO DIAPOSITIVA (1m 15s)</div>
        <div class="total-time-badge" id="totalTimeDisplay">Total: 00:00</div>
      </div>
    </div>

    <!-- Navigation Pills -->
    <div class="slide-pills-wrapper">
      <div class="slide-pills" id="slidePillsContainer">
        <!-- Generated via JS -->
      </div>
    </div>

    <!-- Herramientas compactas -->
    <div class="timer-tools">
      <button class="btn btn-sm" id="btnFontMinus" title="Disminuir tamaño de letra">A-</button>
      <button class="btn btn-sm" id="btnFontPlus" title="Aumentar tamaño de letra">A+</button>
      <button class="btn btn-sm btn-active" id="btnSoundToggle" title="Activar/Desactivar avisos sonoros">
        <span id="lblSound">🔔</span>
      </button>
      <button class="btn btn-sm" id="btnFullscreen" title="Modo Pantalla Completa">⛶</button>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
  </div>

  <!-- Main Teleprompter Area (Aprovechamiento de toda la pantalla y texto fluido) -->
  <main>
    <section class="script-panel">
      <div class="slide-header-tag">
        <div class="diapo-badge-container">
          <span class="diapo-badge" id="slideNumberBadge">DIAPO 2</span>
          <span class="diapo-title" id="slideTitleHeading">Crisis del Malware y Cajas Negras en los SOCs</span>
          <span class="diapo-subtitle" id="slideSubtitleHeading">Contexto y Motivación: El Malware en los SOCs</span>
        </div>
        <div class="meta-badges-group">
          <div class="reading-speed-badge" id="slideTimerGoal">Fijo: 1 min 15 seg</div>
          <div class="stats-badge" id="slideStatsMeta">0 palabras · Ritmo: ~120 ppm</div>
        </div>
      </div>

      <!-- Texto continuo sin recuadros por párrafo -->
      <div class="teleprompter-content" id="teleprompterContent"></div>

      <!-- Apoyo visual al pie -->
      <div class="visual-cue-box" id="visualCueContainer" style="display: none;">
        <span class="visual-cue-title">💡 Apoyo visual:</span>
        <span class="visual-cue-text" id="visualCueText"></span>
      </div>
    </section>
  </main>

  <!-- Bottom Control Bar -->
  <footer>
    <div class="playback-controls">
      <button class="btn" id="btnPrev" title="Diapositiva Anterior (Tecla ←)">⏮️ Anterior</button>
      <button class="btn btn-primary btn-large" id="btnPlayPause" title="Iniciar / Pausar (Barra Espaciadora)">
        ▶️ Iniciar
      </button>
      <button class="btn" id="btnNext" title="Siguiente Diapositiva (Tecla →)">Siguiente ⏭️</button>
      <button class="btn" id="btnReset" title="Reiniciar tiempo de esta diapo (Tecla R)">🔄 Reiniciar</button>
    </div>

    <div class="hotkey-hints">
      <span><kbd>Espacio</kbd> Play/Pausa</span>
      <span><kbd>→</kbd> Siguiente</span>
      <span><kbd>←</kbd> Anterior</span>
      <span><kbd>R</kbd> Reiniciar</span>
      <span><kbd>F</kbd> Pantalla Completa</span>
    </div>
  </footer>

          "Para validar experimentalmente la propuesta seleccionamos dos datasets públicos referentes: CICMalDroid 2020 para Android (>17.000 muestras estáticas y dinámicas) y ClaMP para Windows PE (68 características). Usaremos una partición 70/15/15 estratificada.",
          "Mediremos rendimiento (Accuracy, F1, AUC), eficiencia computacional (latencia de inferencia y explicación, RAM pico, throughput y speedup) y calidad XAI (fidelidad por perturbación y estabilidad sintáctica), contrastando con baselines tradicionales y del estado del arte."
        ],
        visualCue: "Hacer notar las tres columnas de la validación: no solo se mide precisión, sino latencia real y fidelidad de las explicaciones frente a los dos baselines."
      },
      {
        id: 14,
        title: "Plan de Trabajo y Estado de Avance Actual",
        subtitle: "Distribución temporal y avance cronológico en los dos semestres lectivos",
        paragraphs: [
          "En cuanto a la planificación, durante este Semestre I hemos completado el planteamiento del problema (T1), la revisión sistemática PRISMA (T2), la formulación de objetivos (T3) y estamos cerrando el diseño metodológico (T4).",
          "Para los meses restantes de 2026 ejecutaremos la preparación de datasets (T5) y los benchmarks baselines (T6), entregando el informe final en diciembre (H1). Durante 2027-1 completaremos el desarrollo, validación y defensa de título."
        ],
        visualCue: "Mostrar que el Semestre I ya tiene los hitos de fundamentación y revisión sistemática cumplidos y que el cronograma avanza según lo planificado."
      },
      {
        id: 15,
        title: "Conclusiones del Avance y Ronda de Preguntas",
        subtitle: "Síntesis del aporte conceptual y apertura del diálogo con la comisión evaluadora",
        paragraphs: [
          "En conclusión, este informe de avance consolida las bases teóricas y de ingeniería para resolver un problema crítico: viabilizar la IA explicable en el monitoreo en tiempo real de ciberseguridad.",
          "Nuestra propuesta ataca el costo en 3 niveles complementarios sin sacrificar la detección.",
          "Agradecemos sinceramente su atención y abrimos el espacio para las preguntas y comentarios de la profesora Pamela Hermosilla y el profesor Sebastian Berrios."
        ],
        visualCue: "Dejar la diapositiva final en pantalla proyectando el agradecimiento y el nombre de los profesores de la comisión evaluadora."
      }
    ];

    /* ==========================================================
       ESTADO DE LA APLICACIÓN
       ========================================================== */
    let currentSlideIndex = 0;
    let timeLeft = SLIDE_DURATION_SECONDS;
    let isRunning = false;
    let timerInterval = null;
    let totalSecondsElapsed = 0;
    let totalTimerInterval = null;
    let soundEnabled = true;
    let currentFontSize = 2.05; // Tamaño amplio continuo

    // Sintetizador de audio nativo (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq = 440, type = 'sine', duration = 0.15) {
      if (!soundEnabled) return;
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn("Audio context warning:", e);
      }
    }

    function playSlideChangeChime() {
      if (!soundEnabled) return;
      playBeep(587.33, 'triangle', 0.12); // D5
      setTimeout(() => playBeep(880, 'triangle', 0.22), 120); // A5
    }

    function playWarningBeep() {
      if (!soundEnabled) return;
      playBeep(440, 'sine', 0.08);
    }

    /* ==========================================================
       ELEMENTOS DOM
       ========================================================== */
    const timerDisplay = document.getElementById('timerDisplay');
    const totalTimeDisplay = document.getElementById('totalTimeDisplay');
    const progressBarFill = document.getElementById('progressBarFill');
    const slidePillsContainer = document.getElementById('slidePillsContainer');
    const slideNumberBadge = document.getElementById('slideNumberBadge');
    const slideTitleHeading = document.getElementById('slideTitleHeading');
    const slideSubtitleHeading = document.getElementById('slideSubtitleHeading');
    const teleprompterContent = document.getElementById('teleprompterContent');
    const visualCueContainer = document.getElementById('visualCueContainer');
    const visualCueText = document.getElementById('visualCueText');
    const slideStatsMeta = document.getElementById('slideStatsMeta');
    const timerStatusLabel = document.getElementById('timerStatusLabel');

    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnReset = document.getElementById('btnReset');
    const btnSoundToggle = document.getElementById('btnSoundToggle');
    const lblSound = document.getElementById('lblSound');
    const btnFullscreen = document.getElementById('btnFullscreen');

    /* ==========================================================
       RENDERIZADO DE DIAPOSITIVAS
       ========================================================== */
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function renderSlidePills() {
      slidePillsContainer.innerHTML = '';
      slidesData.forEach((s, idx) => {
        const pill = document.createElement('div');
        pill.className = `slide-pill ${idx === currentSlideIndex ? 'active' : ''}`;
        pill.textContent = `Diapo ${s.id}`;
        pill.addEventListener('click', () => goToSlide(idx));
        slidePillsContainer.appendChild(pill);
      });
      const activePill = slidePillsContainer.children[currentSlideIndex];
      if (activePill) {
        activePill.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
      }
    }

    function loadSlide(index) {
      currentSlideIndex = index;
      const slide = slidesData[index];

      // Actualizar encabezados
      slideNumberBadge.textContent = `DIAPO ${slide.id}`;
      slideTitleHeading.textContent = slide.title;
      slideSubtitleHeading.textContent = slide.subtitle || "";

      // Renderizar texto continuo y fluido (párrafos sin recuadros individuales)
      teleprompterContent.innerHTML = '';
      let totalWords = 0;

      slide.paragraphs.forEach(pText => {
        const pEl = document.createElement('p');
        
        let formatted = pText
          .replace(/(cajas negras|Inteligencia Artificial Explicable|XAI|SHAP|LIME|TreeSHAP|KernelSHAP)/gi, '<strong>$1</strong>')
          .replace(/(Centro de Operaciones de Seguridad|SOC|falsos positivos|fatiga de alertas|costo computacional|framework multinivel)/gi, '<strong>$1</strong>')
          .replace(/(Stacking Ensemble|Destilación de Conocimiento|LightGBM|Modelo Profesor|Modelo Estudiante|Caché Vectorial)/gi, '<strong>$1</strong>')
          .replace(/(O\(2\^?n?\)|O\(2ⁿ\)|O\(T·L·D²\)|O\(1\)|Régimen Ligero|Régimen Profundo)/gi, '<strong>$1</strong>')
          .replace(/(CICMalDroid 2020|ClaMP|PRISMA)/gi, '<strong>$1</strong>');
        
        pEl.innerHTML = formatted;
        teleprompterContent.appendChild(pEl);

        const words = pText.trim().split(/\s+/).length;
        totalWords += words;
      });

      // Apoyo Visual al pie de la diapositiva
      if (slide.visualCue) {
        visualCueContainer.style.display = 'flex';
        visualCueText.textContent = slide.visualCue;
      } else {
        visualCueContainer.style.display = 'none';
      }

      // Estadísticas de palabras y velocidad
      const wpm = Math.round((totalWords / SLIDE_DURATION_SECONDS) * 60);
      slideStatsMeta.textContent = `${totalWords} palabras · Ritmo: ~${wpm} ppm (${index + 1}/${slidesData.length})`;

      // Actualizar selector
      renderSlidePills();

      // Resetear tiempo para esta diapo
      resetTimer();
    }

    function goToSlide(index) {
      if (index < 0 || index >= slidesData.length) return;
      loadSlide(index);
      playSlideChangeChime();
    }

    /* ==========================================================
       CONTROL DEL CRONÓMETRO
       ========================================================== */
    function updateTimerDisplay() {
      timerDisplay.textContent = formatTime(timeLeft);

      // Alertas visuales según el tiempo restante
      timerDisplay.classList.remove('time-warning', 'time-critical');
      if (timeLeft <= 10) {
        timerDisplay.classList.add('time-critical');
        document.documentElement.style.setProperty('--timer-color', 'var(--red)');
      } else if (timeLeft <= 20) {
        timerDisplay.classList.add('time-warning');
        document.documentElement.style.setProperty('--timer-color', 'var(--yellow)');
      } else {
        document.documentElement.style.setProperty('--timer-color', 'var(--primary)');
      }

      // Relleno de barra de progreso (0% a 100%)
      const percentage = ((SLIDE_DURATION_SECONDS - timeLeft) / SLIDE_DURATION_SECONDS) * 100;
      progressBarFill.style.width = `${percentage}%`;
    }

    function tick() {
      if (timeLeft > 0) {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft === 15) {
          playWarningBeep();
        } else if (timeLeft === 5 || timeLeft === 3 || timeLeft === 1) {
          playWarningBeep();
        }
      } else {
        // Tiempo cumplido: avanza automáticamente a la siguiente diapo
        if (currentSlideIndex < slidesData.length - 1) {
          goToSlide(currentSlideIndex + 1);
        } else {
          pauseTimer();
          timerStatusLabel.textContent = "¡FIN DEL ENSAYO COMPLETO!";
          playBeep(523.25, 'sine', 0.5);
        }
      }
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      btnPlayPause.innerHTML = '⏸️ Pausar';
      btnPlayPause.classList.remove('btn-primary');
      btnPlayPause.classList.add('btn-active');
      timerStatusLabel.textContent = "REPRODUCIENDO...";

      timerInterval = setInterval(tick, 1000);
      totalTimerInterval = setInterval(() => {
        totalSecondsElapsed++;
        totalTimeDisplay.textContent = `Total: ${formatTime(totalSecondsElapsed)}`;
      }, 1000);
    }

    function pauseTimer() {
      if (!isRunning) return;
      isRunning = false;
      btnPlayPause.innerHTML = '▶️ Iniciar';
      btnPlayPause.classList.remove('btn-active');
      btnPlayPause.classList.add('btn-primary');
      timerStatusLabel.textContent = "PAUSADO";

      clearInterval(timerInterval);
      clearInterval(totalTimerInterval);
    }

    function togglePlayPause() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function resetTimer() {
      timeLeft = SLIDE_DURATION_SECONDS;
      updateTimerDisplay();
      if (!isRunning) {
        timerStatusLabel.textContent = "TIEMPO DIAPOSITIVA (1m 15s)";
      }
    }

    /* ==========================================================
       EVENT LISTENERS Y ATAJOS DE TECLADO
       ========================================================== */
    btnPlayPause.addEventListener('click', togglePlayPause);
    btnNext.addEventListener('click', () => {
      if (currentSlideIndex < slidesData.length - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    });
    btnPrev.addEventListener('click', () => {
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    });
    btnReset.addEventListener('click', resetTimer);

    // Ajustes de tamaño de fuente
    document.getElementById('btnFontPlus').addEventListener('click', () => {
      currentFontSize = Math.min(currentFontSize + 0.2, 3.4);
      document.documentElement.style.setProperty('--script-font-size', `${currentFontSize}rem`);
    });

    document.getElementById('btnFontMinus').addEventListener('click', () => {
      currentFontSize = Math.max(currentFontSize - 0.2, 1.2);
      document.documentElement.style.setProperty('--script-font-size', `${currentFontSize}rem`);
    });

    // Sonido ON / OFF
    btnSoundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      lblSound.textContent = soundEnabled ? '🔔' : '🔕';
      btnSoundToggle.classList.toggle('btn-active', soundEnabled);
      if (soundEnabled) playBeep(600, 'sine', 0.1);
    });

    // Pantalla completa
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    });

    // Navegación por teclado
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        if (currentSlideIndex < slidesData.length - 1) {
          goToSlide(currentSlideIndex + 1);
        }
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        if (currentSlideIndex > 0) {
          goToSlide(currentSlideIndex - 1);
        }
      } else if (e.code === 'KeyR') {
        e.preventDefault();
        resetTimer();
      } else if (e.code === 'KeyF') {
        e.preventDefault();
        btnFullscreen.click();
      }
    });

    // Iniciar en la primera diapo
    loadSlide(0);
  </script>
</body>
</html>
